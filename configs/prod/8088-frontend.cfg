frontend http_in_8088
    bind *:8088
    bind *:8002
    bind *:8003
    mode http
    option http-keep-alive
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    stats enable
    stats uri /stats
    monitor-uri	/checkstatus
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    http-request use-service prometheus-exporter if { path /metrics }
    ####
    #acl is_whitelisted_ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is_whitelisted_ip
    ####
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i proxy.sabagame.com proxy.gamesaba.com client.sabagame.com client.gamesaba.com sc-client.foodpandaoh.net sc-proxy.nebula.prod 10.2.189.50:8002 -i proxy.sabagame.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net proxy2.v-gaming.net proxy.vgaming.win proxy2.vgaming.win vg-client.foodpandaoh.net vg-proxy.nebula.prod 10.2.189.50:8003 -i proxy.vgames88.com -i proxy.playvgames.com -i client.vgames88.com -i client.playvgames.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/gn-proxy-numberx-win.map)] if { hdr(host) -i proxy.numberx.win -i proxy2.numberx.win -i proxy.numberx.club -i proxy2.numberx.club -i proxy.sabakeno.com -i proxy.kenosaba.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/mg-mgproxy-sabagame-com.map)] if { hdr(host) -i mgproxy.sabagame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
