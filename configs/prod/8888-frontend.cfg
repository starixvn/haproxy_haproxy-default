frontend http_in_8888
  bind *:8888
  mode http
  option forwardfor
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  use_backend %[path,map_beg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i proxy.sabagame.com }
  use_backend %[path,map_beg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i proxy.gamesaba.com }

default_backend l1_notification_service_PROD_be
