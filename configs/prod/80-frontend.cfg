frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    monitor-uri	/checkstatus
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net proxy2.v-gaming.net proxy.vgaming.win proxy2.vgaming.win vg-client.foodpandaoh.net sc-proxy.nebula.prod -i proxy.vgames88.com -i proxy.playvgames.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i proxy.sabagame.com proxy.gamesaba.com client.sabagame.com sc-client.foodpandaoh.net client.gamesaba.com vg-proxy.nebula.prod -i proxy.sabagame.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/gn-proxy-numberx-win.map)] if { hdr(host) -i proxy.numberx.win -i proxy2.numberx.win -i proxy.numberx.club -i proxy2.numberx.club }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/gn-proxy-sabakeno-com.map)] if { hdr(host) -i proxy.sabakeno.com -i proxy.kenosaba.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
