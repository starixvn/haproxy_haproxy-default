frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    monitor-uri	/checkstatus
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    
    #use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net }
    #use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i proxy2.v-gaming.net }
    use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net -i proxy2.v-gaming.net -i proxy.vgaming.win -i proxy2.vgaming.win }
    use_backend %[path,map_beg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i proxy.sabagame.com proxy.gamesaba.com client.sabagame.com sc-client.foodpandaoh.net client.gamesaba.com 10.2.189.50:80 }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
