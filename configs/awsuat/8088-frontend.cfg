frontend http_in_8088
    bind *:8088
    mode http
    option http-keep-alive
    # add X-FORWARDED-FOR
    option forwardfor
    # add X-CLIENT-IP
    #http-request add-header X-CLIENT-IP %[src]
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    capture request header X-Client-IP len 20
    stats enable
    stats uri /stats
    monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-l1uatclient-sgamesuat-com.map)] if { hdr(host) -i l1uatclient.sgamesuat.com l1uatcli.foodpandaoh.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2uatclient-sgamesuat-com.map)] if { hdr(host) -i l2uatclient.sgamesuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2uatclient-foodpandaoh-net.map)] if { hdr(host) -i l2uatclient.foodpandaoh.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-ll2uatclient-foodpandaoh-net.map)] if { hdr(host) -i ll2uatclient.foodpandaoh.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
