#
frontend healthcheck
	bind *:8001
	monitor-uri	/checkstatus
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive

    # L1 - LOCAL
    acl none_https hdr(host) -m reg -i l[^\.]-auth[^\.]*\.lumigame.com$ -i auth.lumigame.com hdr(host) -i oldgames.lumigame.com hdr(host) -i npm.lumigame.com
    #http-request redirect scheme https if !none_https
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy3.map)] if { hdr(host) -i l1-proxy3.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy2.map)] if { hdr(host) -i l1-proxy2.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy1.map)] if { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i l1-proxy.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2-proxy2-lumigame-com.map)] if { hdr(host) -i l2-proxy2.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2-proxy3-lumigame-com.map)] if { hdr(host) -i l2-proxy3.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-l1-client-lumigame-com.map)] if { hdr(host) -i l1-client.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-bots-lumigame-com.map)] if { hdr(host) -i bots.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/gn-gn-proxy-lumigame-com.map)] if { hdr(host) -i gn-proxy.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-live-lumigame-com.map)] if { hdr(host) -i live.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-sample-site-nexdev-net.map)] if { hdr(host) -i sample-site.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/sp-hd-proxy-lumigame-com.map)] if { hdr(host) -i hd-proxy.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
