#
frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/luminetsoft.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    #acl mobile_cache hdr_beg(host) -i l1-m[^.].lumigame.com hdr_beg(host) -i l2-m[^.].lumigame.com
    #http-response set-header Cache-Control public,max-age=31536000 if mobile_cache
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy3.map)] if { hdr(host) -i l1-proxy3.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy2.map)] if { hdr(host) -i l1-proxy2.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy1.map)] if { hdr(host) -i l1-proxy1.lumigame.com -i l1-proxy1.luminetsoft.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i l1-proxy.lumigame.com -i l1-proxy.luminetsoft.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l3-game-proxy.map)] if { hdr(host) -i l3-proxy.lumigame.com }
    #use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-proxy.map)] if { hdr(host) -i nexops-proxy.lumigame.com }
    
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2-proxy2-lumigame-com.map)] if { hdr(host) -i l2-proxy2.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2-proxy3-lumigame-com.map)] if { hdr(host) -i l2-proxy3.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
    
default_backend default_backend_nodes
