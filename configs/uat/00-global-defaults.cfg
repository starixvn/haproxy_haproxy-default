global
    maxconn 100000
    log 10.2.190.91:514 len 8096 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    stats socket /var/run/haproxy.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 1
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    mode http
    log global
    compression algo gzip
    compression type text/css text/html text/javascript application/javascript text/plain text/xml application/json application/x-msgpack application/octet-stream
    option httplog
    #option dontlog-normal
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 20000
    timeout connect 10s
    timeout client 5m
    timeout server 5m
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3
    option forwardfor except 10.77.15.8
    #option forwardfor header X-Real-IP

backend empty_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "KBT UAT - healthy"

backend default_backend_nodes
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake."
###
