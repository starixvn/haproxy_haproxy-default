#
frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    option dontlog-normal
    http-request use-service prometheus-exporter if { path /metrics }
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    #acl is_whitelisted_ip hdr_ip(x-forwarded-for,1) -f /etc/haproxy/whitelisted.ips
    #acl is_whitelisted_ip src -m ip -f /etc/haproxy/whitelisted.ips
    #http-request deny if !external_domains !is_whitelisted_ip
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    monitor-uri	/checkstatus
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    ### L1
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-game-proxy.map)] if { hdr(host) -i l1uatproxy.sgamesuat.com proxy.saba.games }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i l2uatproxy.sgamesuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-l1uatclient-sgamesuat-com.map)] if { hdr(host) -i l1uatclient.sgamesuat.com l1uatcli.foodpandaoh.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-l2uatcli-foodpandaoh-net.map)] if { hdr(host) -i l2uatcli.foodpandaoh.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/gn-gnuatproxy-sgamesuat-com.map)] if { hdr(host) -i gnuatproxy.sgamesuat.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
    http-request redirect code 301 location https://sabagames.io%[capture.req.uri] if { hdr_dom(host) -m end saba.games }
    http-request redirect code 301 location https://www.sabagames.io%[capture.req.uri] if { hdr_dom(host) -m end www.saba.games }

default_backend default_backend_nodes
